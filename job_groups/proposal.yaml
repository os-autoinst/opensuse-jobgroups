        testsuite: null
        settings:
          <<: *bci
          BCI_IMAGE_MARKER: valkey_latest
          BCI_TEST_ENVS: all,metadata,valkey
    - bci_rabbitmq_podman:
        testsuite: null
        settings:
          <<: *bci
          BCI_IMAGE_MARKER: rabbitmq_latest
