scenarios:
  aarch64:
    # Submitted to the main group
    #opensuse-Tumbleweed-WSL-aarch64:
    #  - wsl2-main-25H2:
    #      testsuite: null
    #      machine: win11_uefi_aarch64_wsl2
    #      settings:
    #        YAML_SCHEDULE: 'schedule/wsl/wsl_main.yaml'
    #        WSL_INSTALL_FROM: 'build'
