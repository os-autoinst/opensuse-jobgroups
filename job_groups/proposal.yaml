.agama_textmode_recycled_testsuite: &agama_textmode_recycled_testsuite
  BOOT_HDD_IMAGE: "1"
  +QEMURAM: '1536'
  DESKTOP: textmode
  VIDEOMODE: "text"
  HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%-agama@%MACHINE%.qcow2'
  START_AFTER_TEST: 'create_hdd_agama_textmode'
  UEFI_PFLASH_VARS: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%-agama@%MACHINE%-uefi-vars.qcow2'

.agama_gnome_recycled_testsuite: &agama_gnome_recycled_testsuite
  BOOT_HDD_IMAGE: "1"
  NOAUTOLOGIN: '1'
  DESKTOP: gnome
  HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%-agama@%MACHINE%.qcow2'
  UEFI_PFLASH_VARS: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%-agama@%MACHINE%-uefi-vars.qcow2'
  START_AFTER_TEST: 'create_hdd_agama_gnome'

.agama_kde_recycled_testsuite: &agama_kde_recycled_testsuite
  BOOT_HDD_IMAGE: "1"
  NOAUTOLOGIN: '1'
  DESKTOP: kde
  HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%-agama@%MACHINE%.qcow2'
  UEFI_PFLASH_VARS: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%-agama@%MACHINE%-uefi-vars.qcow2'
  START_AFTER_TEST: 'create_hdd_agama_kde'

.agama: &agama
  NOAUTOLOGIN: "1"
  INST_INSTALL_URL: '%MIRROR_PREFIX%/%REPO_0%'
  YAML_SCHEDULE: schedule/install/agama_install.yaml

.agama_staging: &agama_staging
  NOAUTOLOGIN: "1"
  YAML_SCHEDULE: schedule/install/agama_install.yaml
  OFFLINE_SUT: "1"

# This is needed here so we can reuse agama's anchors
.bci: &bci
  <<: *agama_textmode_recycled_testsuite
  NOVIDEO: "1"
  BCI_TESTS: "1"
  BCI_PREPARE: "1"
  BCI_TESTS_REPO: "https://github.com/SUSE/BCI-tests.git"
  BCI_TIMEOUT: "5400"  # some tests take very long, specially in aarch64
  # BCI_TEST_ENVS: "all,base,init,dotnet,python,node,go,openjdk,openjdk_devel,minimal,repository,multistage"
  QEMUCPUS: "2"
  QEMURAM: "4096"
  CONTAINER_RUNTIMES: "podman"
  BCI_TARGET: "factory-totest"
  +FLAVOR: 'BCI'

