    #        WSL2: '1'
    opensuse-Tumbleweed-DVD-aarch64:
    - supportserver_generator_from_hdd_gnome:
        settings:
          BOOTFROM: c
          BOOT_HDD_IMAGE: '1'
          CONSOLE_JUST_ACTIVATED: '0'
          DESKTOP: gnome
          HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-gnome@%MACHINE%.qcow2'
          PUBLISH_HDD_1: openqa_support_server_%DISTRI%-%VERSION%_%ARCH%_%BUILD%@%MACHINE%_%DESKTOP%.qcow2
          UEFI_PFLASH_VARS: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-gnome@%MACHINE%-uefi-vars.qcow2'
          YAML_SCHEDULE: schedule/supportserver_generator_from_hdd.yaml
        testsuite: null
    - install_only:
        machine: aarch64-uefi_https_boot
    - install_only:
        machine: aarch64_cpu_max_mte_on
    - install_only:
        machine: aarch64_cpu_max_rme_on
    - install_only:
        machine: aarch64_qemu_sbsa_usb
    - repo_inst
    - create_hdd_textmode_ext4
    - create_hdd_gnome_sdboot
    - create_hdd_gnome_sdboot:
        machine: aarch64-secureboot-ms-key
    - create_hdd_gnome_sdboot:
        machine: aarch64-secureboot-opensuse-key
    - extra_tests_sdboot_fde
    - create_hdd_gnome_grub2-bls
    - create_hdd_gnome_grub2-bls:
        machine: aarch64-secureboot-ms-key
    - create_hdd_gnome_grub2-bls:
        machine: aarch64-secureboot-opensuse-key
    - extra_tests_grub_bls_fde
# wicked_settings anchor is also used in opensuse-Tumbleweed-DVD-x86_64 , please keep in mind before tweak content
    - wicked_startandstop_sut: &wicked_settings
        settings:
          DESKTOP: textmode
          EXTRATEST: wicked
          VIDEOMODE: text
          WICKED_TCPDUMP: '1'
          VIRTIO_CONSOLE_NUM: '2'
          _QUIET_SCRIPT_CALLS: '1'
          BOOT_HDD_IMAGE: '1'
          HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%@%MACHINE%.qcow2'
          UEFI_PFLASH_VARS: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%@%MACHINE%-uefi-vars.qcow2'
          WORKER_CLASS: tap
          NICTYPE: tap
          OVS_DEBUG: '1'
          TAPDEV: 'auto,auto'
          START_AFTER_TEST: 'create_hdd_textmode'
    - wicked_startandstop_ref:
        *wicked_settings
    - wicked_ipv6_ref:
        *wicked_settings
    - wicked_ipv6_sut:
        *wicked_settings
    - firewalld-policy-firewall:
        settings:
          START_AFTER_TEST: 'create_hdd_textmode'
          HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%@%MACHINE%.qcow2'
    - firewalld-policy-server:
        settings:
          START_AFTER_TEST: 'create_hdd_textmode'
          HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%@%MACHINE%.qcow2'
    - firewalld-policy-client:
        settings:
          START_AFTER_TEST: 'create_hdd_textmode'
          HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%DESKTOP%@%MACHINE%.qcow2'
    - lynis_gnome
    - lynis_textmode
    opensuse-Tumbleweed-NET-aarch64:
    - yast2_ncurses_minimalx
    - lvm-encrypt-separate-boot:
          settings:
            YAML_TEST_DATA: test_data/yast/encryption/lvm_encrypt_separate_boot_luks2.yaml
    opensuse-Tumbleweed-JeOS-for-RPi-aarch64:
    - jeos-ltp-ima:
        machine: RPi4
        priority: 55
        settings:
          PASSWORD: linux
          WORKER_CLASS: generalhw_RPi4_TPM
    opensuse-Tumbleweed-JeOS-for-AArch64-aarch64:
    - jeos-combustion:
        settings:
          FIRST_BOOT_CONFIG: 'combustion'
          HDD_2: 'extended_combustion.qcow2'
          NUMDISKS: '3'
    - jeos-ssh-enroll-server:
        settings:
          +HDD_1: support_server_tumbleweed@aarch64.qcow2
          UEFI_PFLASH_VARS: support_server_tumbleweed@aarch64-uefi-vars.qcow2
          SSH_ENROLL_PAIR: '1'
          YAML_SCHEDULE: schedule/jeos/supportserver.yaml
          WORKER_CLASS: qemu_aarch64,tap
    - jeos-ssh-enroll-wizard:
        settings:
          PARALLEL_WITH: jeos-ssh-enroll-server
          YAML_SCHEDULE: schedule/jeos/ssh-enroll.yaml
          WORKER_CLASS: qemu_aarch64,tap
    - jeos-extra:
        machine: aarch64_cpu_max-HD20G
    - jeos:
        machine: aarch64_cpu_max_mte_on-HD20G
    - jeos:
        machine: aarch64_cpu_max_rme_on-HD20G
    - jeos:
        machine: aarch64_qemu_sbsa
    - jeos-extra:
        machine: RPi3
        priority: 55
        settings:
          PASSWORD: linux
    - jeos-extra:
        machine: RPi4
        priority: 55
        settings:
          PASSWORD: linux
    - zdup_twjeos2twnext_rpi:
        machine: RPi3
        priority: 55
        settings:
          PASSWORD: linux
    - zdup_twjeos2twnext_rpi:
        machine: RPi4
        priority: 55
        settings:
          PASSWORD: linux
    - zdup_twjeos2twnext_rpi2:
        machine: RPi2B
        priority: 55
        settings:
          PASSWORD: linux
