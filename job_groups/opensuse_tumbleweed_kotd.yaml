.kotd_chains:
  ltp: &kotd_ltp_chain
    START_AFTER_TEST: install_ltp+opensuse+KOTD
    HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%FLAVOR%@%MACHINE%-with-ltp.qcow2'
    UEFI_PFLASH_VARS: ''
  ltp_aarch64: &kotd_ltp_chain_aarch64
    START_AFTER_TEST: install_ltp+opensuse+KOTD
    HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%FLAVOR%@%MACHINE%-with-ltp.qcow2'
    UEFI_PFLASH_VARS: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%FLAVOR%@%MACHINE%-with-ltp-uefi-vars.qcow2'
  xfstests: &kotd_xfstests_chain
    settings:
      START_AFTER_TEST: install_kotd_xfstests
      HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%FLAVOR%@%MACHINE%-with-xfstests-kotd.qcow2'
      UEFI_PFLASH_VARS: ''
  xfstests_aarch64: &kotd_xfstests_chain_aarch64
    settings:
      START_AFTER_TEST: install_kotd_xfstests
      HDD_1: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%FLAVOR%@%MACHINE%-with-xfstests-kotd.qcow2'
      UEFI_PFLASH_VARS: '%DISTRI%-%VERSION%-%ARCH%-%BUILD%-%FLAVOR%@%MACHINE%-with-xfstests-kotd-uefi-vars.qcow2'
defaults:
  x86_64:
    machine: 64bit
    priority: 50
  aarch64:
    machine: aarch64
    priority: 50
  ppc64le:
    machine: ppc64le
    priority: 50
  s390x:
    machine: s390x-zVM-vswitch-l2
    priority: 50
    settings:
      HDD_1: ''
      INSTALL_LTP: 'from_repo'
      LTP_BAREMETAL: '1'
      START_AFTER_TEST: ''
      VIDEOMODE: 'text'
      MAX_JOB_TIME: '14400'
      KOTD_REPO: 'https://download.opensuse.org/repositories/Kernel:/HEAD/S390/'
      INSTALL_KOTD: '1'
products:
  opensuse-Tumbleweed-KOTD-x86_64:
    distri: opensuse
    flavor: KOTD
    version: Tumbleweed
  opensuse-Tumbleweed-KOTD-aarch64:
    distri: opensuse
    flavor: KOTD
    version: Tumbleweed
  opensuse-Tumbleweed-KOTD-ppc64le:
